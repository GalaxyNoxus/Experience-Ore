pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.kikugie.dev/releases' }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'dev.kikugie.stonecutter' version '0.9.8'
    id 'dev.kikugie.loom-back-compat' version '0.4.2'
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

if (!JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_25)) {
    throw new GradleException('Execute o Gradle com JDK 25. Os alvos 1.21.x usam toolchain Java 21.')
}

rootProject.name = 'xp-ore'

stonecutter {
    kotlinController = false
    centralScript = 'build.gradle'
    create(rootProject) {
        versions '1.21', '1.21.1', '1.21.2', '1.21.3', '1.21.4', '1.21.5', '1.21.6', '1.21.7', '1.21.8', '1.21.9', '1.21.10', '1.21.11', '26.1', '26.1.1', '26.1.2', '26.2', '26.3'
        vcsVersion = '1.21.1'
    }
}
