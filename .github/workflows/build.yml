name: Build and Publish Experience Ore
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.matrix.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: echo "versions=$(jq -c . targets.json)" >> "$GITHUB_OUTPUT"
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 tools/publish_modrinth.py --validate-tag
  build:
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        minecraft: ${{ fromJSON(needs.targets.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Minecraft ${{ matrix.minecraft }}
        run: bash ./gradlew --no-daemon :${{ matrix.minecraft }}:buildAndCollect
      - uses: actions/upload-artifact@v4
        with:
          name: xpore-mc${{ matrix.minecraft }}
          path: build/libs/**/*.jar
          if-no-files-found: error
  publish:
    needs: [targets, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'GalaxyNoxus/experience-ore'
    runs-on: ubuntu-latest
    concurrency:
      group: modrinth-xp-ore
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: xpore-mc*
          path: artifacts
      - name: Publish Minecraft versions to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT: xp-ore
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 tools/publish_modrinth.py
