name: Build and Publish Experience Ore

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Test release packaging
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - id: matrix
        run: python3 tools/build_matrix.py >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 tools/publish_modrinth.py --validate-tag

  build:
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Fabric ${{ matrix.minecraft }}
        if: matrix.loader == 'fabric'
        run: bash ./gradlew --no-daemon :${{ matrix.minecraft }}:buildAndCollect

      - name: Build Forge ${{ matrix.minecraft }}
        if: matrix.loader == 'forge'
        run: bash ./forge/gradlew -p forge -PminecraftVersion=${{ matrix.minecraft }} --no-daemon buildAndCollect

      - uses: actions/upload-artifact@v4
        with:
          name: xpore-raw-${{ matrix.loader }}-${{ matrix.minecraft }}
          path: build/raw/${{ matrix.loader }}/${{ matrix.minecraft }}/*.jar
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: xpore-raw-*
          path: artifacts

      - name: Consolidate identical builds
        run: python3 tools/prepare_release.py --input artifacts --output build/release

      - uses: actions/upload-artifact@v4
        with:
          name: xpore-release
          path: build/release/*
          if-no-files-found: error

  publish:
    needs: package
    if: github.repository == 'GalaxyNoxus/experience-ore'
    runs-on: ubuntu-latest
    concurrency:
      group: modrinth-xp-ore
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: xpore-release
          path: release

      - name: Publish grouped versions to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT: xp-ore
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 tools/publish_modrinth.py
